[package]
name = "agon-libretro-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Libretro's Rust CI templates rename this artifact to agon_libretro.<ext>.
name = "agon"
crate-type = ["cdylib"]

[dependencies]
agon-ez80-emulator = { workspace = true }
ez80 = "0.5.0"
libretro-backend = { path = "../vendor/libretro-backend" }
libloading = "0.8.0"
